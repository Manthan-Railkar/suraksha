; Suraksha firmware - ESP32-WROOM-32 DevKit V1 on the EDU-ROBO V14 trainer board.
; Build/upload with PlatformIO (VS Code extension or `pio run -t upload`).
[platformio]
default_envs = esp32dev

[common]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0

; Environment for physical ESP32 board
[env:esp32dev]
extends = common
build_flags =
    -DCORE_DEBUG_LEVEL=0

; Environment for Wokwi simulation
[env:wokwi]
extends = common
build_flags =
    -DWOKWI_SIMULATION
    -DCORE_DEBUG_LEVEL=1
